[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chat-watchdog"
version = "0.1.0"
description = "Private watchdog for one already-open ChatGPT work conversation"
requires-python = ">=3.11"
dependencies = ["websocket-client>=1.8"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
chat-watchdog = "chat_watchdog.cli:main"
chat-watchdog-registry = "chat_watchdog.registry_cli:main"

[tool.setuptools]
packages = ["chat_watchdog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
