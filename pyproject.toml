[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chat-watchdog"
dynamic = ["version"]
description = "Private watchdog for exact ChatGPT work conversations"
requires-python = ">=3.11"
dependencies = ["websocket-client>=1.8"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
chat-watchdog = "chat_watchdog.cli:main"
chat-watchdog-registry = "chat_watchdog.registry_cli:main"

[tool.setuptools]
packages = ["chat_watchdog"]

[tool.setuptools.dynamic]
version = {attr = "chat_watchdog.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
